{% extends 'base/layout.html' %}
{% load i18n %}
{% load form_helpers %}
{% block title %}{% trans "Import document" %}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col col-md-8"><div class="card">
  <h5 class="card-header">{% trans "Import Word, Excel or PDF" %}</h5>
  <div class="card-body"><form method="post" enctype="multipart/form-data">{% csrf_token %}{% render_form form %}
    <div class="text-muted mb-3">
      {% trans "Import notes" %}
      <span class="mdi mdi-help-circle-outline" data-bs-toggle="tooltip" title="{% trans "DOCX keeps headings, lists and tables. A regular XLSX import merges all sheets. The multi-sheet import creates one document per sheet in the target folder. PDF requires a real text layer; OCR for scans is not included." %}" aria-label="{% trans "Import notes" %}"></span>
    </div>
    <button type="submit" class="btn btn-primary">{% trans "Import" %}</button>
  </form></div>
</div></div></div>
{% endblock %}
